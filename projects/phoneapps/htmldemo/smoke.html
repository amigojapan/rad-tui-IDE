<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FutureShell terminal smoke check</title>
<p id="result">WAITING</p>
<iframe id="demo" src="index.html" title="FutureShell demo" style="width:560px;height:900px"></iframe>
<script>
if (new URLSearchParams(location.search).has('mobile')) {
  document.getElementById('demo').style.width = '360px';
  document.getElementById('demo').style.height = '760px';
}
if (new URLSearchParams(location.search).has('native')) {
  document.getElementById('demo').style.width = '350px';
  document.getElementById('demo').style.height = '730px';
}
if (new URLSearchParams(location.search).has('wide')) {
  document.getElementById('demo').style.width = '1280px';
  document.getElementById('demo').style.height = '800px';
}
let attempts = 0;
const timer = setInterval(async () => {
  const frame = document.getElementById('demo');
  const d = frame.contentDocument;
  if (!d || !d.getElementById('status')?.textContent.includes('WebAssembly ready')) {
    if (++attempts > 200) { document.getElementById('result').textContent = 'FAIL: WebAssembly did not load'; clearInterval(timer); }
    return;
  }
  clearInterval(timer);
  const result = document.getElementById('result');
  const canvas = d.getElementById('terminal');
  const cols = Number(canvas.dataset.cols);
  const rect = canvas.getBoundingClientRect();
  const click = (x, y, right = false) => canvas.dispatchEvent(new frame.contentWindow.MouseEvent(right ? 'contextmenu' : 'click', {
    bubbles: true,
    clientX: rect.left + (x + .5) * rect.width / cols,
    clientY: rect.top + (y + .5) * rect.height / Number(canvas.dataset.rows)
  }));
  const check = (condition, label) => { if (!condition) throw new Error(label); };
  const waitFor = async condition => {
    for (let attempt = 0; attempt < 60; attempt++) {
      if (condition()) return true;
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    return false;
  };
  const home = () => click(5, 0);
  const entry = index => {
    const innerWidth = cols - 1;
    const columns = Math.max(1, Math.min(4, Math.floor(innerWidth / 20)));
    const gridWidth = Math.min(innerWidth, columns * 20);
    const tileWidth = Math.floor(gridWidth / columns);
    const left = Math.floor((innerWidth - gridWidth) / 2);
    click(left + (index % columns) * tileWidth + Math.floor(tileWidth / 2),
      4 + Math.floor(index / columns) * 3);
  };
  const folder = entry;
  const app = entry;
  const input = d.getElementById('terminalInput');
  const shellCommand = command => {
    input.value = command;
    input.dispatchEvent(new Event('input'));
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'Enter', bubbles: true}));
  };
  try {
    const viewport = frame.contentWindow.visualViewport;
    check(Math.abs(rect.width - (viewport?.width || frame.contentWindow.innerWidth)) <= 1 &&
          Math.abs(rect.height - (viewport?.height || frame.contentWindow.innerHeight)) <= 1,
      'FutureShell fills its browser container');
    check(canvas.dataset.screen === 'bash' && canvas.dataset.keyboard === 'visible', 'FutureShell startup');
    check(canvas.dataset.shellEngine === 'futureshell.wasm', 'FutureShell WebAssembly boots on page load');
    check(canvas.getAttribute('aria-label').includes('Welcome to FutureShell') &&
          canvas.getAttribute('aria-label').includes('Prompt dollar sign'), 'welcome and shell prompt');
    check(d.activeElement === input, 'shell input focused on boot');
    check(input.inputMode === 'none' && input.getAttribute('virtualkeyboardpolicy') === 'manual',
      'browser software keyboard disabled while input stays focused');
    const keyboardRows = Number(canvas.dataset.rows);
    const keyHeight = keyboardRows >= 32 ? 3 : 1;
    const keyboardLeft = Math.floor((cols - 30) / 2);
    click(keyboardLeft + 1, keyboardRows - 4 * keyHeight + Math.floor(keyHeight / 2)); // q
    check(input.value === 'q', 'FutureShell screen keyboard still types');
    input.value = '';
    input.dispatchEvent(new Event('input'));
    shellCommand('echo wasm-shell');
    check(canvas.dataset.lastShellLine === 'wasm-shell', 'WebAssembly shell handles commands');
    shellCommand('bash --version');
    check(canvas.dataset.lastShellLine === 'Sample bash clone for futureshell web demo', 'Bash clone version response');
    shellCommand('cd games');
    check(canvas.dataset.folder === 'games', 'WebAssembly shell changes folders');
    shellCommand('ls');
    check(canvas.dataset.lastShellLine.includes('tic-tac-toe.bin'), 'WebAssembly shell reads DTF catalog');
    home();
    check(canvas.dataset.screen === 'DT' && canvas.dataset.folder === '' &&
          canvas.dataset.keyboard === 'hidden', 'Home opens DT and hides keyboard');
    folder(0); // games
    app(1); // tic-tac-toe
    check(canvas.dataset.screen === 'tic-tac-toe', 'Tic Tac Toe opens');
    click(9, 6); // btn0 in tic-tac-toe.json
    check(canvas.getAttribute('aria-label').includes('Your turn') ||
          canvas.getAttribute('aria-label').includes('AI Wins'), 'Tic Tac Toe move');
    home();
    folder(2); // tools
    app(1); // calc
    check(canvas.dataset.screen === 'calc', 'Calculator opens');
    click(3, 11); // 7
    click(18, 15); // +
    click(8, 11); // 8
    click(18, 21); // =
    check(canvas.getAttribute('aria-label').includes('Display 15.'), 'Calculator 7 + 8');
    home();
    folder(0); // games
    app(0); // minesweeper
    check(canvas.dataset.screen === 'minesweeper', 'Minesweeper opens');
    click(3, 6, true); // right-click b0_0
    check(canvas.getAttribute('aria-label').includes('Flags 1.'), 'Minesweeper flag');
    home();
    folder(1); // internet
    app(0); // Future Browser
    check(canvas.dataset.screen === 'futurebrowser', 'Future Browser opens');
    click(5, 4); // txt_url
    check(input.value === 'https://amjp.psy-k.org/futureshell/repo/webasm/tic-tac-toe.webasm.bin', 'default WebAssembly URL');
    input.value = d.defaultView.location.origin + '/missing.bin';
    input.dispatchEvent(new Event('input'));
    click(Math.floor((cols - 1 - 7) / 2) + 3, 7); // GO!
    check(await waitFor(() => d.getElementById('status').textContent === '404 not found'), '404 message');
    input.value = d.defaultView.location.origin + '/sample-download.bin';
    input.dispatchEvent(new Event('input'));
    click(Math.floor((cols - 1 - 7) / 2) + 3, 7);
    check(await waitFor(() => d.getElementById('status').textContent === 'Downloaded file is not compatible WebAssembly'), 'reject non-WebAssembly file');
    input.value = d.defaultView.location.origin + '/tic-tac-toe.webasm.bin';
    input.dispatchEvent(new Event('input'));
    click(Math.floor((cols - 1 - 7) / 2) + 3, 7);
    check(await waitFor(() => canvas.dataset.screen === 'tic-tac-toe' && canvas.dataset.downloaded === 'yes'), 'downloaded WebAssembly runs');
    click(9, 6);
    check(canvas.dataset.board.includes('X'), 'downloaded game responds to move');
    home();
    check(canvas.dataset.downloaded === 'no', 'Home stops downloaded game');
    folder(2); // tools
    app(2); // nano
    check(canvas.dataset.screen === 'nano', 'Nano opens');
    check(d.activeElement === input, 'Nano buffer focused when opened');
    click(Math.floor(cols / 2), Number(canvas.dataset.rows) - 2); // show keyboard
    check(canvas.dataset.keyboard === 'visible', 'Nano screen keyboard opens');
    const nanoRows = Number(canvas.dataset.rows);
    const modeY = keyRows => nanoRows - (keyRows + 3) * keyHeight + Math.floor(keyHeight / 2);
    const romanKey = letter => {
      const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
      const row = rows.findIndex(value => value.includes(letter));
      const index = rows[row].indexOf(letter);
      const width = Math.floor(30 / rows[row].length);
      const x = keyboardLeft + index * width + Math.min(index, 30 % rows[row].length) +
        Math.floor((width + (index < 30 % rows[row].length ? 1 : 0)) / 2);
      canvas.focus(); // a real Android tap moves focus off the hidden editor
      click(x, nanoRows - 4 * keyHeight + row * keyHeight + Math.floor(keyHeight / 2));
    };
    click(keyboardLeft + 21, modeY(3)); // ROM
    romanKey('k'); romanKey('a');
    check(input.value === 'か', 'ROM keyboard converts ka to か');
    check(canvas.dataset.nanoCursor === '0,2', 'Nano cursor follows a converted kana');
    for (const key of 'shi')
      input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key, bubbles: true}));
    check(input.value === 'かし', 'physical romaji keys convert shi to し');
    check(canvas.dataset.nanoCursor === '0,4', 'Nano cursor follows physical romaji input');
    click(keyboardLeft + 21, modeY(3)); // restart ROM composition
    input.value = '';
    input.dispatchEvent(new Event('input'));
    for (const key of 'tesuto') {
      romanKey(key);
      if ('ts'.includes(key)) click(keyboardLeft + 21, modeY(3)); // interrupted composition
    }
    check(input.value === 'てすと', `ROM screen keyboard converts tesuto to てすと (got ${JSON.stringify(input.value)})`);
    click(keyboardLeft + 2, nanoRows - 2);
    check(JSON.parse(canvas.dataset.candidateOptions).join(',') === '試験,てすと,テスト',
      'ROM Space offers kanji, hiragana, and katakana for tesuto');
    click(keyboardLeft + 12, nanoRows - 2);
    check(input.value === '試験', 'ROM Enter commits the tesuto kanji synonym');
    click(keyboardLeft + 21, modeY(3)); // restart ROM composition
    input.value = '';
    input.dispatchEvent(new Event('input'));
    for (const key of 'konnichiha') romanKey(key);
    check(input.value === 'こんにちは', 'ROM keyboard converts a complete greeting');
    check(canvas.dataset.nanoCursor === '0,10', 'Nano cursor follows the last Japanese character');
    click(keyboardLeft + 12, nanoRows - 2); // newline in Nano
    romanKey('a'); romanKey('i');
    check(input.value === 'こんにちは\nあい' && canvas.dataset.nanoCursor === '1,4',
      'ROM input and Nano cursor continue after a newline');
    input.setSelectionRange(0, 0);
    input.dispatchEvent(new Event('select'));
    check(canvas.dataset.nanoCursor === '0,0', 'Nano cursor follows a moved text selection');
    click(keyboardLeft + 21, modeY(3)); // restart ROM composition
    input.value = '';
    input.dispatchEvent(new Event('input'));
    for (const key of 'kai') romanKey(key);
    click(keyboardLeft + 2, nanoRows - 2); // Space opens kanji candidates
    check(JSON.parse(canvas.dataset.candidateOptions).slice(0, 4).join(',') === '会,回,階,貝',
      'ROM Space shows native kanji candidates');
    click(keyboardLeft + 2, nanoRows - 2); // Space selects next candidate
    check(canvas.dataset.candidateIndex === '1', 'ROM Space cycles kanji candidates');
    click(keyboardLeft + 12, nanoRows - 2); // Enter commits candidate
    check(input.value === '回' && canvas.dataset.candidateIndex === '-1',
      'ROM Enter commits selected kanji without a newline');
    click(keyboardLeft + 21, modeY(3));
    input.value = '';
    input.dispatchEvent(new Event('input'));
    romanKey('a'); romanKey('i');
    click(keyboardLeft + 2, nanoRows - 2);
    click(keyboardLeft + 15, modeY(3) - keyHeight); // second visible candidate
    check(input.value === '藍' && canvas.dataset.candidateIndex === '-1',
      'tapping a kanji candidate commits it');
    click(keyboardLeft + 21, modeY(3));
    input.value = '';
    input.dispatchEvent(new Event('input'));
    romanKey('k'); romanKey('a');
    click(keyboardLeft + 2, nanoRows - 2);
    click(keyboardLeft + 7, nanoRows - 2); // Backspace cancels conversion
    check(input.value === 'か' && canvas.dataset.candidateIndex === '-1',
      'ROM Backspace cancels kanji selection');
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: ' ', bubbles: true}));
    check(JSON.parse(canvas.dataset.candidateOptions).join(',') === 'か,カ',
      'physical Space opens kana and katakana candidates');
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true}));
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'Enter', bubbles: true}));
    check(input.value === 'カ' && canvas.dataset.candidateIndex === '-1',
      'physical arrow and Enter select katakana');
    click(keyboardLeft + 21, modeY(3)); // restart ROM composition
    input.value = '';
    input.dispatchEvent(new Event('input'));
    romanKey('k'); romanKey('a');
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'Backspace', bubbles: true}));
    check(input.value === 'k', 'ROM Backspace restores the unfinished syllable');
    click(keyboardLeft + 15, modeY(3)); // かな
    input.value = '';
    input.dispatchEvent(new Event('input'));
    const kanaKey = (column, row) => click(keyboardLeft + column * 10 + 5,
      nanoRows - 5 * keyHeight + row * keyHeight + Math.floor(keyHeight / 2));
    for (const [index, expected] of Array.from('あいうえおあ').entries()) {
      kanaKey(0, 0);
      check(input.value === expected, `かな key cycles to ${expected} at tap ${index + 1}`);
    }
    for (const expected of 'かきくけこ') {
      kanaKey(1, 0);
      check(input.value === 'あ' + expected, `かな key cycles to ${expected}`);
    }
    kanaKey(0, 3); // voiced mark
    check(input.value === 'あご', 'かな voiced mark changes こ to ご');
    kanaKey(0, 0); kanaKey(2, 3); // small kana
    check(input.value === 'あごぁ', 'かな small key changes あ to ぁ');
    click(keyboardLeft + 15, modeY(4)); // restart かな composition
    input.value = '';
    input.dispatchEvent(new Event('input'));
    kanaKey(1, 0); kanaKey(0, 0); kanaKey(0, 0); // かい
    click(keyboardLeft + 2, nanoRows - 2);
    check(JSON.parse(canvas.dataset.candidateOptions)[0] === '会', 'かな Space shows kanji candidates');
    click(keyboardLeft + 5, modeY(4) - keyHeight);
    check(input.value === '会' && canvas.dataset.candidateIndex === '-1',
      'かな candidate button commits kanji');
    input.value = 'あ'.repeat(Math.floor((cols - 1) / 2) + 1);
    input.setSelectionRange(input.value.length, input.value.length);
    input.dispatchEvent(new Event('input'));
    check(canvas.dataset.nanoCursor === '1,2', 'Nano wraps wide kana at the terminal edge');
    input.value = 'あ\n'.repeat(50) + '終';
    input.setSelectionRange(input.value.length, input.value.length);
    input.dispatchEvent(new Event('input'));
    check(canvas.dataset.nanoCursor === '50,2' && Number(canvas.dataset.nanoScroll) > 0,
      'Nano scrolls to keep the cursor visible');
    click(keyboardLeft + 3, modeY(4)); // ABC
    input.value = '';
    input.dispatchEvent(new Event('input'));
    click(keyboardLeft + 12, Number(canvas.dataset.rows) - 2); // Ent on screen keyboard
    check(input.value === '\n' && input.selectionStart === 1,
      'Nano screen keyboard Ent inserts a newline');
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'x', ctrlKey: true, bubbles: true}));
    check(canvas.dataset.screen === 'nano' && d.getElementById('status').textContent.includes('read-only buffer'),
      'Nano tracks newline-only edits');
    click(keyboardLeft + 26, Number(canvas.dataset.rows) - 14); // hide keyboard for Nano shortcuts
    check(canvas.dataset.keyboard === 'hidden', 'Nano screen keyboard hides');
    input.value = '';
    input.dispatchEvent(new Event('input'));
    input.value = 'ncurses demo note';
    input.dispatchEvent(new Event('input'));
    click(Math.floor((cols - 1) / 3) + 1, Number(canvas.dataset.rows) - 6); // ^O Write Out
    check(d.getElementById('status').textContent.includes('read-only filesystem'), 'Nano rejects saving');
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'x', ctrlKey: true, bubbles: true}));
    check(canvas.dataset.screen === 'nano' && d.getElementById('status').textContent.includes('read-only buffer'),
      'modified Nano buffer reports read-only error on Ctrl+X');
    input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'x', ctrlKey: true, bubbles: true}));
    check(canvas.dataset.screen === 'DT', 'second Ctrl+X discards modified buffer');
    home();
    folder(2);
    app(0); // bash
    check(canvas.dataset.screen === 'bash', 'Bash opens');
    check(d.activeElement === input, 'shell input focused when reopened');
    click(Math.floor(cols / 2), Number(canvas.dataset.rows) - 2);
    check(canvas.dataset.keyboard === 'visible', 'screen keyboard');
    result.textContent = 'PASS: FutureShell WebAssembly boot and commands, DT, games, calculator, Future Browser, editor, keyboard';
  } catch (error) { result.textContent = 'FAIL: ' + error.message; }
}, 50);
</script>
