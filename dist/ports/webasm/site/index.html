<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#101918">
  <meta name="mobile-web-app-capable" content="yes">
  <title>FutureShell · WebAssembly demo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/futureshell-192.png">
  <link rel="stylesheet" href="styles.css?v=no-ime-1">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #terminal {
      position: fixed;
      left: var(--viewport-left, 0px);
      top: var(--viewport-top, 0px);
      width: var(--viewport-width, 100vw);
      height: var(--viewport-height, 100vh);
      max-width: none;
      max-height: none;
      border: 0;
    }
  </style>
  <script src="futureshell.js?v=no-ime-1" defer></script>
  <script src="app.js?v=dist-mine-resize-1" defer></script>
</head>
<body>
  <canvas id="terminal" role="application" tabindex="0"
          aria-label="FutureShell terminal. Use Tab to select controls and Enter to activate them.">
    This demo needs a browser with Canvas and WebAssembly support.
  </canvas>
  <textarea id="terminalInput" aria-label="Terminal text input" autocomplete="off"
            autocapitalize="off" spellcheck="false" inputmode="none"
            virtualkeyboardpolicy="manual"></textarea>
  <span id="status" class="sr-only" role="status">Loading WebAssembly…</span>
</body>
</html>
