<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator — RAD-TUI Web</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head><body>
<h2 style="text-align:center">RAD-TUI Web — Calculator</h2>
<div id="loading">Loading Python (Pyodide)…</div>
<div class="form" id="form" style="--fw:336px;--fh:400px">
  <div class="form-title">Calculator</div>
  <div class="form-body" id="form-body"><div style="left:16px;top:36px;width:288px;height:18px" class="ctrl textbox" id="txtDisplay" data-name="txtDisplay">0</div>
<button style="left:16px;top:90px;width:64px;height:54px" class="ctrl button" id="btn7" data-name="btn7">7</button>
<button style="left:88px;top:90px;width:64px;height:54px" class="ctrl button" id="btn8" data-name="btn8">8</button>
<button style="left:160px;top:90px;width:64px;height:54px" class="ctrl button" id="btn9" data-name="btn9">9</button>
<button style="left:232px;top:90px;width:64px;height:54px" class="ctrl button" id="btnDivide" data-name="btnDivide">/</button>
<button style="left:16px;top:162px;width:64px;height:54px" class="ctrl button" id="btn4" data-name="btn4">4</button>
<button style="left:88px;top:162px;width:64px;height:54px" class="ctrl button" id="btn5" data-name="btn5">5</button>
<button style="left:160px;top:162px;width:64px;height:54px" class="ctrl button" id="btn6" data-name="btn6">6</button>
<button style="left:232px;top:162px;width:64px;height:54px" class="ctrl button" id="btnMultiply" data-name="btnMultiply">*</button>
<button style="left:16px;top:234px;width:64px;height:54px" class="ctrl button" id="btn1" data-name="btn1">1</button>
<button style="left:88px;top:234px;width:64px;height:54px" class="ctrl button" id="btn2" data-name="btn2">2</button>
<button style="left:160px;top:234px;width:64px;height:54px" class="ctrl button" id="btn3" data-name="btn3">3</button>
<button style="left:232px;top:234px;width:64px;height:54px" class="ctrl button" id="btnSubtract" data-name="btnSubtract">-</button>
<button style="left:16px;top:306px;width:64px;height:54px" class="ctrl button" id="btnClear" data-name="btnClear">C</button>
<button style="left:88px;top:306px;width:64px;height:54px" class="ctrl button" id="btn0" data-name="btn0">0</button>
<button style="left:160px;top:306px;width:64px;height:54px" class="ctrl button" id="btnEquals" data-name="btnEquals">=</button>
<button style="left:232px;top:306px;width:64px;height:54px" class="ctrl button" id="btnAdd" data-name="btnAdd">+</button></div>
</div>
<div id="msgbox"><div class="box"><div id="msgbox-title" style="font-weight:bold;margin-bottom:8px"></div><div id="msgbox-text" style="margin-bottom:12px;white-space:pre-wrap"></div><button id="msgbox-ok" class="button">OK</button></div></div>
<script type="module" src="app.js"></script>
</body></html>
